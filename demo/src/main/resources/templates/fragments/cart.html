<div th:fragment="carrito">
    <!-- Offcanvas Carrito -->
    <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasCart" aria-labelledby="offcanvasCartLabel">
        <div class="offcanvas-header border-bottom border-success">
            <h5 class="offcanvas-title" id="offcanvasCartLabel"><i class="bi bi-cart3 me-2"></i>Tu Carrito</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="cart-items" class="flex-grow-1">
                <!-- items inyectados por JS -->
                <div id="cart-empty" class="text-center py-5">
                    <i class="bi bi-cart-x display-4 text-success"></i>
                    <p class="mt-3">Tu carrito está vacío</p>
                    <p class="small text-white-50">Agrega productos desde las cards</p>
                </div>
            </div>

            <div id="cart-footer" class="border-top border-success pt-3 mt-3 d-none">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-bold">Subtotal:</span>
                    <span class="fw-bold fs-5 text-success" id="cart-total">S/. 0.00</span>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-success" onclick="checkout()"><i class="bi bi-bag-check me-1"></i> Finalizar compra</button>
                    <button class="btn btn-outline-light" onclick="clearCart()">Vaciar carrito</button>
                </div>
                <p class="small text-white-50 mt-2 text-center mb-0">Los pedidos se confirman por WhatsApp / demo localStorage</p>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="cartToastMsg">Producto agregado</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</div>
