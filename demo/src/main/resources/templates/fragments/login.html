    <div th:fragment="login" class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-success">
                <div class="modal-header border-success">
                    <h5 class="modal-title">Iniciar Sesión - GreenByte</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/login}" method="get" id="form-login">
                        <div class="mb-1 mt-2">
                            <label class="form-label">Correo electrónico</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="admin@greenbyte.com" required>
                            <div class="form-text text-light opacity-75">Usa <b>admin@greenbyte.com</b> para rol Administrador. Cualquier otro correo entra como Cliente.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="cualquier contraseña" required>
                            <div class="form-text text-light opacity-75">Para demo: <code>admin123</code> o cualquier clave.</div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mb-2">Ingresar</button>
                        <div class="text-center small">
                            <span class="text-white-50">¿No tienes cuenta? Usa cualquier correo y entrarás como cliente.</span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
