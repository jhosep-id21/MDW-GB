<div th:fragment="login" class="modal fade" id="modal-acceso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-success">
            <div class="modal-header border-success">
                <h5 class="modal-title">Mi cuenta - GreenByte</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs nav-fill mb-3" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="pestana-acceso" data-bs-toggle="tab"
                            data-bs-target="#panel-acceso" type="button" role="tab">Iniciar Sesión</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="pestana-registro" data-bs-toggle="tab" data-bs-target="#panel-registro"
                            type="button" role="tab">Registrarse</button>
                    </li>
                </ul>
                <div class="tab-content">
                    <!-- ACCESO (validado en backend: GET /iniciar-sesion + HttpSession) -->
                    <div class="tab-pane fade show active" id="panel-acceso" role="tabpanel">
                        <form th:action="@{/iniciar-sesion}" method="get" id="formulario-acceso">
                            <div class="mb-2">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" name="correo" id="correo" class="form-control" placeholder="tu@correo.com"
                                    required>
                            </div>
                            <div class="mb-1">
                                <label class="form-label">Contraseña</label>
                                <input type="password" name="clave" id="clave" class="form-control" placeholder="Tu contraseña"
                                    required>
                            </div>
                            <div class="form-text text-light opacity-75 mb-3">Admin demo: <b>admin@greenbyte.com</b> /
                                <code>admin123</code>. Clientes: usa tu cuenta registrada abajo.</div>
                            <button type="submit" class="btn btn-success w-100 mb-2">Ingresar</button>
                            <div class="text-center small"><span class="text-white-50">¿Nuevo aquí? </span><a href="#"
                                    onclick="irARegistro(event)" class="text-success">Crea tu cuenta gratis</a></div>
                        </form>
                    </div>
                    <!-- REGISTRO -->
                    <div class="tab-pane fade" id="panel-registro" role="tabpanel">
                        <form id="formulario-registro" onsubmit="return crearCuenta(event)">
                            <div class="mb-2">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" id="registro-nombre" class="form-control" placeholder="Ej: Ana Torres"
                                    required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" id="registro-correo" class="form-control" placeholder="tu@correo.com"
                                    required>
                            </div>
                            <div class="row">
                                <div class="mb-2 col-6">
                                    <label class="form-label">Contraseña</label>
                                    <input type="password" id="registro-clave" class="form-control" minlength="4" required>
                                </div>
                                <div class="mb-2 col-6">
                                    <label class="form-label">Repetir contraseña</label>
                                    <input type="password" id="registro-clave-repetida" class="form-control" minlength="4" required>
                                </div>
                            </div>
                            <div id="registro-error" class="alert alert-danger py-2 small d-none"></div>
                            <div id="registro-aviso" class="alert alert-success py-2 small d-none"></div>
                            <button type="submit" class="btn btn-success w-100 mb-2">Crear cuenta</button>
                            <div class="text-center small text-white-50">Al registrarte aceptas nuestros términos. Tus
                                credenciales se guardan en este navegador (demo sin backend).</div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
