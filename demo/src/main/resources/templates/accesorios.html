<!DOCTYPE html>
<html lang="es-es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenByte - Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" th:href="@{/iconos/ico-greenbyte-sinfondo.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header th:replace="fragments/header :: navegador"></header>
    <div th:replace="fragments/login :: login"></div>
    <div th:replace="fragments/cart :: carrito"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0"><i class="bi bi-tools me-2 text-success"></i> Accesorios</h2>
            <span class="badge bg-success" th:text="${#lists.size(productos)} + ' productos'">0 productos</span>
        </div>
        <p class="text-white-50">Herramientas, sustratos y todo lo que necesitas para cuidar tu jungla.</p>

        <div class="row align-items-stretch justify-content-center g-3 mt-2">
            <div th:each="prod : ${productos}" class="col-xl-3 col-lg-4 col-md-6 d-flex justify-content-center product-card">
                <div class="card d-flex flex-column w-100" style="max-width: 18rem; min-height: 32rem;">
                    <img th:src="@{${prod.imagen}}" class="card-img-top" th:alt="${prod.alt}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${prod.nombre}">Nombre</h5>
                        <p class="card-text small text-white-50" th:text="${prod.descripcion}">Descripción</p>
                        <div class="mt-auto">
                            <p class="mb-2"><strong class="text-success fs-5" th:text="'S/. ' + ${#numbers.formatDecimal(prod.precio,1,2)}">S/. 0.00</strong></p>
                            <button class="btn btn-success w-100" data-add-to-cart
                                th:data-id="${prod.id}"
                                th:data-nombre="${prod.nombre}"
                                th:data-precio="${prod.precio}"
                                th:data-imagen="${prod.imagen}">
                                <i class="bi bi-cart-plus me-1"></i> Agregar al carrito
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="fragments/footer :: footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script th:src="@{/js/cart.js}"></script>
</body>
</html>
