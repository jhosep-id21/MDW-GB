<!DOCTYPE html>
<html lang="es-es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenByte</title>
    <!--el linl referencia para Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--link referencia para el icono de la página -->
    <link rel="icon" th:href="@{/iconos/ico-greenbyte-sinfondo.png}" type="image/png">
    <!--link referencia para los estilos personalizados -->
    <link rel="stylesheet" th:href="@{/styles.css}">
    <!--link referencia para los iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header th:replace="fragments/header :: navegador"></header>
    <main>
        <div class="container my-4 col-12 col-lg-8 mx-auto bg-dark">
            <h2 class="text-center">Plantas</h2>
            <!--se aplicará un Carousel para complementar el inicio mostrando imágenes de plantas-->
            <div id="carousel-greenbyte-plantas" class="carousel slide">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carousel-greenbyte-plantas" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-plantas" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-plantas" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-plantas" data-bs-slide-to="3"
                        aria-label="Slide 4"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/image-mas-plantas.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item active">
                        <img src="IMG/img-carousel/planta-1.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/imagen-plantas.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/planta-2.jpg" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel-greenbyte-plantas"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel-greenbyte-plantas"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <br>
            <h2 class="text-center">Maceteros</h2>
            <!--se aplicará un Carousel para complementar el inicio mostrando imágenes de maceteros-->
            <div id="carousel-greenbyte-maceteros" class="carousel slide">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carousel-greenbyte-maceteros" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-maceteros" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-maceteros" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-maceteros" data-bs-slide-to="3"
                        aria-label="Slide 4"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/maceta-1.jpg" alt="Maceta 1" class="d-block w-100">
                    </div>
                    <div class="carousel-item active">
                        <img src="IMG/img-carousel/maceta-2.jpg" alt="Maceta 2" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/maceta-3.jpg" alt="Maceta 3" class="d-block w-100">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/maceta-4.jpg" alt="Maceta 4" class="d-block w-100">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel-greenbyte-maceteros"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel-greenbyte-maceteros"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <br>
            <h2 class="text-center">Accesorios</h2>
            <!--se aplicará un Carousel para complementar el inicio mostrando imágenes de accesorios-->
            <div id="carousel-greenbyte-accesorios" class="carousel slide">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carousel-greenbyte-accesorios" data-bs-slide-to="0"
                        class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-accesorios" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carousel-greenbyte-accesorios" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/accesorios-1.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item active">
                        <img src="IMG/img-carousel/accesorios-2.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG/img-carousel/accesorios-3.png" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carousel-greenbyte-accesorios"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carousel-greenbyte-accesorios"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <br>
        </div>

    </main>
    <!--los derechos po-->
    <footer th:replace="fragments/footer :: footer"></footer>
    <!-- y este es el script para Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
