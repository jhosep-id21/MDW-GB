<section id="fichas" th:fragment="herramienta" role="tabpanel" aria-labelledby="tab-fichas" tabindex="0" class="tab-pane active container py-4">
    <h2 class="titulo-editorial mb-3">Fichas técnicas por especie</h2>
    <label for="filtro-fichas" class="form-label">Buscar ficha</label>
    <div class="input-group manual-busqueda mb-4">
        <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
        <input id="filtro-fichas" type="search" class="form-control" placeholder="Ej. Monstera">
    </div>
    <p th:if="${#lists.isEmpty(fichas)}" class="text-body-secondary">Todavía no hay fichas publicadas.</p>
    <div class="row g-3" id="rejilla-fichas">
        <div class="col-md-6 col-lg-4" th:each="ficha : ${fichas}">
            <article class="manual-ficha h-100 rounded-3 p-3 p-md-4">
                <header class="manual-ficha-encabezado pb-3 mb-3">
                    <h3 class="h5 fw-bold mb-2" th:text="${ficha.nombre}"></h3>
                    <span class="manual-ficha-tipo" th:text="${ficha.tipo}"></span>
                </header>
                <p class="manual-ficha-descripcion" th:text="${ficha.descripcion}"></p>
                <dl class="manual-ficha-cuidados rounded-3 p-3 mb-3">
                    <dt><i class="bi bi-sun me-2" aria-hidden="true"></i>Luz</dt>
                    <dd th:text="${ficha.luz}"></dd>
                    <dt><i class="bi bi-droplet me-2" aria-hidden="true"></i>Riego</dt>
                    <dd class="mb-0" th:text="${ficha.riego}"></dd>
                </dl>
                <details th:if="${!#strings.isEmpty(ficha.notas)}" class="manual-ficha-notas">
                    <summary>Notas de cuidado</summary>
                    <p class="mb-0 mt-2" th:text="${ficha.notas}"></p>
                </details>
            </article>
        </div>
    </div>
</section>
