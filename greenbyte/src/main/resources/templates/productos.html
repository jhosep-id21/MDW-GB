<!DOCTYPE html>
<html lang="es-es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenByte - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" th:href="@{/iconos/ico-greenbyte-sinfondo.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <header th:replace="~{fragments/header-productos :: header-productos}"></header>

    <main class="container py-5">
        <!-- Título de la sección -->
        <div class="text-center mb-5">
            <h2 class="fw-bold" style="color: var(--brand-color, #8C5B46);">Nuestros Productos</h2>
            <p class="text-muted">Encuentra todo lo que necesitas para tus plantas</p>
        </div>

        <!-- Grid de productos (se rellena desde la base de datos mediante Thymeleaf) -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
             th:if="${productos != null and !#lists.isEmpty(productos)}">

            <div class="col" th:each="producto : ${productos}">
                <div class="card tarjeta-producto h-100 shadow-sm">
                    <!-- Imagen del producto (ruta dinámica desde BD) -->
                    <img th:src="@{/img/productos/{imagen}(imagen=${producto.imagen})}"
                         th:alt="${producto.nombre}"
                         class="card-img-top"
                         loading="lazy"/>

                    <div class="card-body d-flex flex-column">
                        <!-- Categoría -->
                        <span class="etiqueta-categoria" th:text="${producto.categoria}">Categoría</span>

                        <!-- Nombre -->
                        <h5 class="card-title" th:text="${producto.nombre}">Nombre del producto</h5>

                        <!-- Descripción -->
                        <p class="card-text descripcion-tarjeta" th:text="${producto.descripcion}">
                            Descripción corta del producto...
                        </p>
                    </div>

                    <!-- Pie de tarjeta con precio y botón -->
                    <div class="pie-tarjeta mt-auto">
                        <p class="precio-tarjeta mb-2"
                           th:text="${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">
                            $0.00
                        </p>
                        <button type="button"
                                class="btn btn-success w-100"
                                th:onclick="'agregarAlCarrito(' + ${producto.id} + ')'"
                                th:title="'Agregar ' + ${producto.nombre} + ' al carrito'">
                            Agregar al carrito
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Mensaje cuando no hay productos -->
        <div th:if="${productos == null or #lists.isEmpty(productos)}"
             class="text-center py-5">
            <i class="bi bi-box-seam fs-1 text-muted mb-3"></i>
            <p class="text-muted">No hay productos disponibles en este momento.</p>
        </div>

    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script th:src="@{/js/cart.js}"></script>
    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/detalle.js}"></script>
</body>

</html>
