<!DOCTYPE html>
<html lang="es-es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenByte - Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" th:href="@{/iconos/ico-greenbyte-sinfondo.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/header :: navegador}"></header>
    <div th:replace="~{fragments/login :: login}"></div>
    <div th:replace="~{fragments/cart :: carrito}"></div>
    <div th:replace="~{fragments/detalle :: detalle}"></div>

    <main class="container py-4 py-lg-5 flex-grow-1">
        <h1 class="display-6 titulo-editorial mb-4">Productos</h1>

        <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 border-bottom pb-3 mb-4">
            <div id="filtro-catalogo" hidden>
                <label for="filtro-categoria" class="form-label fw-semibold">Categoría</label>
                <select id="filtro-categoria" class="form-select">
                    <option value="">Todas las categorías</option>
                    <option value="interior">Plantas de interior</option>
                    <option value="exterior">Plantas de exterior</option>
                    <option value="macetas">Macetas</option>
                    <option value="accesorios">Accesorios</option>
                    <option value="principiantes">Principiantes</option>
                    <option th:each="categoria : ${categorias}" th:value="${categoria.nombre}"
                            th:text="${categoria.nombre}"></option>
                </select>
            </div>
            <div id="orden-catalogo" hidden>
                <label for="orden-productos" class="form-label fw-semibold">Ordenar por</label>
                <select id="orden-productos" class="form-select">
                    <option value="">Orden del catálogo</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                    <option value="stock-desc">Mayor stock</option>
                </select>
            </div>
            <span id="cantidad-productos" class="text-body-secondary small" role="status"
                  th:text="${#lists.size(productos) == 1 ? '1 producto' : #lists.size(productos) + ' productos'}">0 productos</span>
        </div>

        <!-- Grid de productos dinámicos desde MySQL -->
        <div id="rejilla-productos" class="row g-3 g-lg-4"
             th:if="${productos != null and !#lists.isEmpty(productos)}">

            <div class="col-12 col-sm-6 col-lg-4 col-xl-3 tarjeta-producto"
                 th:each="p : ${productos}" th:attr="data-categoria=${p.nombreCategoria},data-precio=${p.precio},data-stock=${p.stock}">
                <article th:replace="~{fragments/tarjeta-producto :: tarjeta(${p})}"></article>
            </div>

        </div>

        <p id="sin-coincidencias" class="text-center text-body-secondary py-5" hidden>
            No hay productos que coincidan con el filtro.
        </p>

        <!-- Mensaje cuando no hay productos -->
        <div th:if="${productos == null or #lists.isEmpty(productos)}" class="text-center py-5">
            <i class="bi bi-box-seam fs-1 text-body-secondary mb-3 d-block"></i>
            <h4 class="text-verde-oscuro">No hay productos registrados en este momento</h4>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
    <script th:src="@{/js/detalle.js}"></script>
    <script th:src="@{/js/catalogo.js}"></script>
</body>

</html>
