<div th:fragment="login" class="modal fade" id="modal-acceso" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <!-- Se eliminó bg-dark y border-success. Se añadió shadow-lg y bordes redondeados suaves -->
        <div class="modal-content border-0 shadow-lg" style="border-radius: 12px; overflow: hidden;">

            <!-- Header con fondo blanco y texto verde oscuro -->
            <div class="modal-header border-bottom-0 pt-4 px-4 pb-0">
                <h5 class="modal-title fw-bold"
                    style="color: #2b4b3b; font-family: 'Playfair Display', serif; font-size: 1.4rem;">
                    Mi cuenta - GreenByte
                </h5>
                <!-- Botón de cerrar estándar de Bootstrap (oscuro) -->
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body px-4 pb-4">
                <!-- Pestañas (Tabs) personalizadas -->
                <ul class="nav nav-underline mb-4" role="tablist" style="--bs-nav-underline-gap: 2rem;">
                    <li class="nav-item" role="presentation">
                        <!-- Usamos nav-underline de Bootstrap 5.3+ y estilos para el color activo -->
                        <button class="nav-link active fw-bold" id="pestana-acceso" data-bs-toggle="tab"
                            data-bs-target="#panel-acceso" type="button" role="tab"
                            style="color: #2b4b3b; border-bottom-color: #2b4b3b;">Iniciar Sesión</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold text-muted" id="pestana-registro" data-bs-toggle="tab"
                            data-bs-target="#panel-registro" type="button" role="tab"
                            style="border-bottom-color: transparent;">Registrarse</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <!-- ACCESO (validado en backend: GET /iniciar-sesion + HttpSession) -->
                    <div class="tab-pane fade show active" id="panel-acceso" role="tabpanel">
                        <form th:action="@{/iniciar-sesion}" method="get" id="formulario-acceso">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase"
                                    style="letter-spacing: 0.5px;">Correo electrónico</label>
                                <input type="email" name="correo" id="correo"
                                    class="form-control form-control-lg bg-light border-0" placeholder="tu@correo.com"
                                    required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label text-muted small fw-bold text-uppercase"
                                    style="letter-spacing: 0.5px;">Contraseña</label>
                                <input type="password" name="clave" id="clave"
                                    class="form-control form-control-lg bg-light border-0" placeholder="Tu contraseña"
                                    required>
                            </div>

                            <!-- Botón principal Terracota -->
                            <button type="submit" class="btn w-100 py-3 mb-3 text-white fw-bold"
                                style="background-color: #A65D43; border-radius: 6px; letter-spacing: 1px;">
                                INGRESAR
                            </button>

                            <div class="text-center small text-muted">
                                ¿Nuevo aquí? <a href="#" onclick="irARegistro(event)"
                                    class="fw-bold text-decoration-none" style="color: #A65D43;">Crea tu cuenta
                                    gratis</a>
                            </div>
                        </form>
                    </div>

                    <!-- REGISTRO -->
                    <div class="tab-pane fade" id="panel-registro" role="tabpanel">
                        <form id="formulario-registro" onsubmit="return crearCuenta(event)">
                            <!-- Nombre y Correo (Ya los tenías) -->
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">Nombre
                                    completo</label>
                                <input type="text" id="registro-nombre"
                                    class="form-control form-control-lg bg-light border-0" placeholder="Ej: Ana Torres"
                                    required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">Correo
                                    electrónico</label>
                                <input type="email" id="registro-correo"
                                    class="form-control form-control-lg bg-light border-0" placeholder="tu@correo.com"
                                    required>
                            </div>

                            <!-- NUEVO: Teléfono -->
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold text-uppercase">Teléfono (para
                                    envíos)</label>
                                <input type="tel" id="registro-telefono"
                                    class="form-control form-control-lg bg-light border-0" placeholder="+34 600 000 000"
                                    required>
                            </div>

                            <!-- Contraseñas (Ya las tenías) -->
                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">Contraseña</label>
                                    <input type="password" id="registro-clave"
                                        class="form-control form-control-lg bg-light border-0" minlength="4" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-muted small fw-bold text-uppercase">Repetir
                                        contraseña</label>
                                    <input type="password" id="registro-clave-repetida"
                                        class="form-control form-control-lg bg-light border-0" minlength="4" required>
                                </div>
                            </div>

                            <!-- NUEVO: Checkboxes de Términos y Newsletter -->
                            <div class="mb-4">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="registro-terminos" required>
                                    <label class="form-check-label small text-muted" for="registro-terminos">
                                        Acepto los <a href="#" class="text-decoration-none"
                                            style="color: #A65D43;">Términos y Condiciones</a> y la Política de
                                        Privacidad.
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="registro-newsletter" checked>
                                    <label class="form-check-label small text-muted" for="registro-newsletter">
                                        Quiero recibir consejos de cuidado y ofertas exclusivas por email.
                                    </label>
                                </div>
                            </div>

                            <!-- Alertas (Ya las tenías) -->
                            <div id="registro-error" class="alert alert-danger py-2 small d-none border-0"></div>
                            <div id="registro-aviso" class="alert alert-success py-2 small d-none border-0"></div>

                            <!-- Botón -->
                            <button type="submit" class="btn w-100 py-3 mb-3 text-white fw-bold"
                                style="background-color: #A65D43; border-radius: 6px; letter-spacing: 1px;">
                                CREAR CUENTA
                            </button>

                            <div class="text-center small text-muted" style="font-size: 0.8rem;">
                                Tus datos están protegidos y nunca compartiremos tu información.
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
