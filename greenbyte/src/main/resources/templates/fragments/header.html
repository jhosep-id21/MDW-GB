<header th:fragment="navegador">
    <nav class="navbar navbar-expand-lg espinitas-style barra-nav py-3">
        <div class="container-fluid px-4 px-lg-5">

            <!-- BLOQUE IZQUIERDO: Logo y Marca -->
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <img th:src="@{/iconos/ico-greenbyte-sinfondo.png}" alt="GreenByte" width="40" height="40" class="me-2">
                <span class="titulo-marca">Green<span>Byte</span></span>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <!-- BLOQUE CENTRAL: Enlaces principales -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-lg-center gap-3">
                    <li class="nav-item"><a class="nav-link" th:href="@{/inicio}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contactanos}">Contáctanos</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">Manual Byte 🌿</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/fichas}">Fichas Técnicas por Especie</a></li>
                            <li><a class="dropdown-item" th:href="@{/calculadora-riego}">Calculadora de Riego</a></li>
                            <li><a class="dropdown-item" th:href="@{/tips-luz}">Tips según tu Tipo de Luz</a></li>
                        </ul>
                    </li>
                </ul>

                <!-- BLOQUE DERECHO: Acciones -->
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 gap-lg-4 mb-2 mb-lg-0">

                    <span class="promo-text d-none d-xl-inline">Solo hoy: envíos gratis</span>

                    <!-- Buscador -->
                    <form class="d-flex buscador-minimalista mt-2 mt-lg-0" role="search" onsubmit="return false;">
                        <input class="form-control" type="search" id="buscador-productos" placeholder="Buscar..."
                            aria-label="Buscar" />
                        <button class="btn-buscar" type="button" onclick="filtrarProductos()"><i
                                class="bi bi-search"></i></button>
                    </form>

                    <!-- Usuario / Login -->
                    <ul class="navbar-nav align-items-lg-center mt-2 mt-lg-0">
                        <li class="nav-item" th:if="${session.logueado == null}">
                            <a class="nav-link d-flex align-items-center gap-2" data-bs-toggle="modal"
                                data-bs-target="#modal-acceso" href="#">
                                <i class="bi bi-person-circle fs-5"></i> Iniciar Sesión
                            </a>
                        </li>
                        <li class="nav-item dropdown" th:if="${session.logueado != null}">
                            <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false" th:title="${session.usuario}">
                                <i class="bi bi-person-circle fs-5"></i>
                                <span class="nombre-usuario"
                                    th:text="${session.nombre != null ? session.nombre : session.usuario}">usuario</span>
                                <span class="badge rounded-pill"
                                    th:classappend="${session.rol == 'ADMIN'} ? 'bg-danger' : 'bg-success'"
                                    th:text="${session.rol}">ROL</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <h6 class="dropdown-header text-truncate" style="max-width:220px"
                                        th:text="${session.usuario}">correo</h6>
                                </li>
                                <li th:if="${session.rol == 'ADMIN'}"><a class="dropdown-item"
                                        th:href="@{/administrador}"><i class="bi bi-shield-lock me-1"></i> Panel</a>
                                </li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" th:href="@{/cerrar-sesion}"><i
                                            class="bi bi-box-arrow-right me-1"></i> Cerrar sesión</a></li>
                            </ul>
                        </li>
                    </ul>

                    <!-- Carrito -->
                    <button class="btn-carrito-minimalista mt-2 mt-lg-0" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#panel-carrito" aria-controls="panel-carrito" title="Carrito">
                        <i class="bi bi-bag fs-4"></i>
                        <span id="contador-carrito" class="contador-numero">0</span>
                    </button>
                </div>

            </div>
        </div>
    </nav>
</header>
