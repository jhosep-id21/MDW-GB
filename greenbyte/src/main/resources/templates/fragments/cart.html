<div th:fragment="carrito">
    <div class="offcanvas offcanvas-end bg-light text-dark" tabindex="-1" id="panel-carrito">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="titulo-panel-carrito">
                <i class="bi bi-cart3 me-2"></i>Tu Carrito
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="lista-carrito" class="flex-grow-1">
                <div id="carrito-vacio" class="text-center py-5">
                    <i class="bi bi-cart-x display-4 text-muted"></i>
                    <p class="mt-3 mb-1 fw-bold">Tu carrito está vacío</p>
                    <p class="small text-muted">Agrega productos desde la tienda</p>
                </div>

            </div>
            <div id="pie-carrito" class="border-top pt-3 d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold">Total:</span>
                    <span class="fw-bold fs-4 text-success" id="total-carrito">S/. 0.00</span>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-success btn-lg" onclick="finalizarCompra()">
                        <i class="bi bi-bag-check me-2"></i>Finalizar compra
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="vaciarCarrito()">
                        Vaciar carrito
                    </button>
                </div>
                <p class="small text-muted mt-3 text-center mb-0">
                    Los pedidos se confirman por WhatsApp
                </p>
            </div>

        </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="aviso-carrito" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div id="mensaje-aviso" class="toast-body">
                    Producto agregado con éxito
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

</div>
