<section id="calculadora-riego" th:fragment="herramienta" role="tabpanel" aria-labelledby="tab-calculadora-riego" tabindex="0" class="tab-pane container py-4 col-12 col-lg-8 mx-auto">
        <div class="text-center mb-4">
            <h2 class="tema-titulo mb-2">
                <i class="bi bi-calculator me-2 text-warning"></i>Calculadora de Riego
            </h2>
            <p class="text-muted small">Ajusta los parámetros y presiona Calcular.</p>
        </div>
        <div class="card tarjeta-tema shadow-sm p-3 p-md-4">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label fw-bold">Especie</label><select id="riego-planta"
                        class="form-select">
                        <option value="tropical">Tropical (Monstera, Pothos)</option>
                        <option value="suculenta">Suculenta (Aloe, Sansevieria)</option>
                        <option value="helecho">Helecho / Calathea</option>
                        <option value="aromatica">Aromática (Menta, Lavanda)</option>
                        <option value="flor">Flor exterior (Geranio, Hortensia)</option>
                    </select></div>
                <div class="col-md-3"><label class="form-label fw-bold">Tamaño maceta</label><select id="riego-maceta"
                        class="form-select">
                        <option value="s">Pequeña (10-12cm)</option>
                        <option value="m" selected>Mediana (14-16cm)</option>
                        <option value="l">Grande (20-24cm)</option>
                    </select></div>
                <div class="col-md-3"><label class="form-label fw-bold">Estación</label><select id="riego-estacion"
                        class="form-select">
                        <option value="verano" selected>Verano / Cálido</option>
                        <option value="invierno">Invierno / Frío</option>
                    </select></div>
                <div class="col-md-4"><label class="form-label fw-bold">Luz disponible</label><select id="riego-luz"
                        class="form-select">
                        <option value="baja">Baja</option>
                        <option value="media" selected>Media</option>
                        <option value="alta">Alta / Sol</option>
                    </select></div>
                <div class="col-md-4"><label class="form-label fw-bold">Ambiente</label><select id="riego-clima"
                        class="form-select">
                        <option value="interior">Interior</option>
                        <option value="exterior" selected>Exterior / Balcón</option>
                    </select></div>
                <div class="col-md-4 d-flex align-items-end"><button class="btn btn-success w-100"
                        onclick="calcularRiego()"><i class="bi bi-droplet me-1"></i> Calcular</button></div>
            </div>
            <div id="resultado-riego" class="alert alert-success border-success mt-4 d-none"></div>
            <p class="small text-muted mt-2 mb-0"><i class="bi bi-lightbulb me-1"></i>Tip: mete el dedo 2cm en la
                tierra; si sale seco, riega. Esta calculadora es orientativa.</p>
        </div>
    </section>
