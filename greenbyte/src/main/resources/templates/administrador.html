<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | GreenByte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" th:href="@{/iconos/ico-greenbyte-sinfondo.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/header-panel :: panel('Administración')}"></header>

    <main class="container py-5 flex-grow-1">
        <h1 class="titulo-editorial mb-4">Administración de usuarios</h1>
        <div class="table-responsive bg-white border rounded-3">
            <table class="table align-middle mb-0">
                <thead>
                    <tr><th scope="col">Nombre</th><th scope="col">Correo</th><th scope="col">Rol asignado</th></tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.correo}"></td>
                        <td th:text="${usuario.acceso != null and usuario.acceso.toString() == 'A' ? 'Administrador' : (usuario.acceso != null and usuario.acceso.toString() == 'G' ? 'Gestor' : 'Cliente')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="3">No hay usuarios registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script th:replace="~{fragments/scripts :: bootstrapJs}"></script>
</body>

</html>
