<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | GreenByte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" th:href="@{/iconos/icono-greenbyte.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/header-panel :: panel('Administración', 'usuarios') }"></header>

    <main class="container py-5 flex-grow-1">
        <h1 class="titulo-editorial mb-4">Administración de usuarios</h1>
        <p th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></p>
        <p th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></p>

        <section th:if="${usuarioEditado != null}" class="bg-white border rounded-3 p-4 mb-4">
            <h2 class="h4 titulo-editorial mb-3">Editar usuario</h2>
            <p th:text="${usuarioEditado.correo}"></p>
            <form method="post" th:action="@{/administrador/usuarios/{id}(id=${usuarioEditado.id})}">
                <input type="hidden" name="token" th:value="${session.tokenCambioRol}">
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label" for="usuario-nombre">Nombre</label>
                        <input class="form-control" id="usuario-nombre" name="nombre"
                               th:value="${usuarioEditado.nombre}" required maxlength="255">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label" for="usuario-telefono">Teléfono</label>
                        <input class="form-control" id="usuario-telefono" name="telefono" type="tel"
                               th:value="${usuarioEditado.telefono}" required maxlength="255">
                    </div>
                    <div class="col-md-4" th:with="rol=${usuarioEditado.acceso?.toString()}">
                        <label class="form-label" for="usuario-acceso">Rol asignado</label>
                        <select class="form-select" id="usuario-acceso" name="acceso">
                            <option value="U" th:if="${usuarioEditado.correo != session.usuario}"
                                    th:selected="${rol != 'A' and rol != 'G'}">Cliente</option>
                            <option value="G" th:if="${usuarioEditado.correo != session.usuario}"
                                    th:selected="${rol == 'G'}">Gestor</option>
                            <option value="A" th:selected="${rol == 'A'}">Administrador</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-success" type="submit">Guardar cambios</button>
                <a class="btn btn-outline-secondary" th:href="@{/administrador}">Cancelar</a>
            </form>
        </section>
        <div class="table-responsive bg-white border rounded-3">
            <table class="table align-middle mb-0">
                <thead>
                    <tr><th scope="col">Nombre</th><th scope="col">Correo</th><th scope="col">Teléfono</th><th scope="col">Rol asignado</th><th scope="col">Acción</th></tr>
                </thead>
                <tbody>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.correo}"></td>
                        <td th:text="${usuario.telefono}"></td>
                        <td th:text="${usuario.acceso != null and usuario.acceso.toString() == 'A' ? 'Administrador' : (usuario.acceso != null and usuario.acceso.toString() == 'G' ? 'Gestor' : 'Cliente')}"></td>
                        <td><a class="btn btn-sm btn-outline-success"
                               th:href="@{/administrador(editar=${usuario.id})}">Editar</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5">No hay usuarios registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script th:replace="~{fragments/scripts :: bootstrapJs}"></script>
</body>

</html>
