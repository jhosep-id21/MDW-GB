<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegir rol | GreenByte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" th:href="@{/iconos/icono-greenbyte.png}" type="image/png">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
    <header th:replace="~{fragments/header-panel :: panel('GreenByte', '')}"></header>

    <main class="container py-5 flex-grow-1">
        <div class="col-lg-7 mx-auto bg-white border rounded-4 p-4 p-md-5">
            <h1 class="titulo-editorial mb-3">Elige cómo entrar</h1>
            <p class="text-body-secondary">Puedes cambiar de rol desde tu perfil cuando lo necesites.</p>
            <form th:action="@{/elegir-rol}" method="post" class="d-grid gap-2">
                <input type="hidden" name="token" th:value="${session.tokenCambioRol}">
                <button th:each="rol : ${session.rolesPermitidos}" type="submit" name="rol"
                        th:value="${rol}" class="btn btn-outline-success text-start p-3"
                        th:text="${rol == 'ADMIN' ? 'Administrador' : (rol == 'GESTOR' ? 'Gestor de catálogo' : 'Cliente')}">
                </button>
            </form>
        </div>
    </main>
    <script th:replace="~{fragments/scripts :: bootstrapJs}"></script>
</body>

</html>
